# FeedMe configuration for a focused IT frontier briefing.

settings:
  defaultSource: hacker-news-best
  maxItemsPerFeed: 8
  dataPath: ./public/data

summary:
  contentMaxChars: 5000
  temperature: 0.4
  maxTokens: 420
  unavailableMessages:
    zh: 无法生成摘要。
    en: Unable to generate summary.
  prompt: |
    You are an exacting IT intelligence editor. Write the entire response in {{summaryLanguage}}.
    Use exactly these three sections:

    [发生了什么]
    State the important technical facts in one or two concise sentences.

    [离谱类比]
    Give one vivid, slightly unhinged analogy that helps a technical reader understand the facts.

    [为什么在乎]
    Explain the likely engineering, product, or ecosystem impact in one concise sentence.

    Rules:
    1. Every factual claim must be grounded in the title or article content.
    2. The analogy may be absurd, but it must only explain existing facts. Never introduce a new capability, benchmark, version, date, cause, or prediction.
    3. Do not invent details when the article is incomplete or unclear. Say what is unknown instead.
    4. Keep the complete response under 180 words and avoid generic marketing language.

    Article title:
    {{title}}

    Article content:
    {{content}}

